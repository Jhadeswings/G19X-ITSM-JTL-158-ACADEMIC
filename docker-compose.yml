services:
  db:
    image: postgres:15
    container_name: talento_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talento_local}
      POSTGRES_DB: ${POSTGRES_DB:-talento_alto_potencial}
      TZ: America/Mexico_City
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script de inicialización: habilita la extensión pg_trgm (Especificación §8)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talento} -d ${POSTGRES_DB:-talento_alto_potencial}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    container_name: talento_backend
    restart: unless-stopped
    # Los secretos del backend (IA, credenciales de seed, etc.) llegan como
    # VARIABLES DE ENTORNO desde backend/.env, que está ignorado por Git y
    # excluido del contexto de build (backend/.dockerignore). NUNCA se hornea
    # un archivo .env dentro de la imagen: `COPY . .` no debe poder copiarlo.
    #
    # `environment:` tiene prioridad sobre `env_file` en Docker Compose, por
    # lo que DATABASE_URL sigue siendo la calculada para la red de compose
    # (host "db"), aunque backend/.env traiga la de localhost.
    env_file:
      - ./backend/.env
    environment:
      TZ: America/Mexico_City
      # Dentro de la red de compose el host es el nombre del servicio "db"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-talento}:${POSTGRES_PASSWORD:-talento_local}@db:5432/${POSTGRES_DB:-talento_alto_potencial}
      # Autenticación (Fase 3): secretos SIEMPRE desde el .env de la raíz,
      # nunca versionados (Especificación Técnica §35).
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY es obligatorio en el .env de la raíz}
      SEED_RH_EMAIL: ${SEED_RH_EMAIL:-}
      SEED_RH_PASSWORD: ${SEED_RH_PASSWORD:-}
    ports:
      - "8000:8000"
    depends_on:
      # Especificación §34: no ejecutar migraciones hasta que PostgreSQL esté healthy
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.core.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    container_name: talento_frontend
    restart: unless-stopped
    environment:
      # Destino del proxy de Vite: dentro de la red de compose el backend es
      # el servicio `backend`. El navegador sigue llamando a rutas relativas
      # en http://localhost:5173 (mismo origen, sin CORS).
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      # Código del host para editar con recarga en caliente…
      - ./frontend:/app
      # …y node_modules DENTRO del contenedor: el volumen anónimo evita que
      # el bind mount anterior tape las dependencias instaladas en la imagen
      # (los binarios nativos de Vite/esbuild son de Linux, no del host).
      - /app/node_modules

  # Buzón SMTP de desarrollo (catch-all). NO arranca con `docker compose
  # up`: se levanta a demanda con `docker compose --profile mail up`.
  # Configurar luego backend/.env con SMTP_HOST=localhost, SMTP_PORT=1025,
  # SMTP_STARTTLS=false y SMTP_FROM=no-reply@empresa.dev; los correos se
  # consultan en http://localhost:8025 (DECISIONES_TECNICAS §53).
  mailhog:
    image: mailhog/mailhog
    container_name: talento_mailhog
    profiles: ["mail"]
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
